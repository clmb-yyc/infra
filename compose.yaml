name: clmb

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: atelier
      POSTGRES_USER: ${ATELIER_DB_USER:?Set ATELIER_DB_USER in .env}
      POSTGRES_PASSWORD: ${ATELIER_DB_PASSWORD:?Set ATELIER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.3.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  api:
    build:
      context: ../atelier/api
    environment:
      ATELIER_DB_URL: jdbc:postgresql://postgres:5432/atelier
      ATELIER_DB_USER: ${ATELIER_DB_USER:?Set ATELIER_DB_USER in .env}
      ATELIER_DB_PASSWORD: ${ATELIER_DB_PASSWORD:?Set ATELIER_DB_PASSWORD in .env}
      ATELIER_JWT_SECRET: ${ATELIER_JWT_SECRET:?Set ATELIER_JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
